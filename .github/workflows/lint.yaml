name: Lint

on:
  pull_request:
    paths-ignore:
      - custom_components/callmebot/manifest.json
  push:
    branches:
      - master
    paths-ignore:
      - custom_components/callmebot/manifest.json

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  lint:
    name: Lint project
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-Linter
        # super-linter v8.7.0
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918
        env:
          DEFAULT_BRANCH: master
          FILTER_REGEX_EXCLUDE: .*(\.py$|/CHANGELOG\.md$)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_PYTHON: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false

      - name: Audit GitHub Actions security
        # zizmor-action v0.6.2
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054
        with:
          advanced-security: false
          annotations: true
          collect: workflows
          version: 1.26.1

      - name: Set up Python
        # actions/setup-python v7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.2

      - name: Run Ruff
        run: make lint-python
